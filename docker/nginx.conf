server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep the "/12" -> "/12/" redirect on the proxied host/scheme
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf+json;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # Fingerprinted build output can be cached hard
    location ~* ^/[0-9]{2}[^/]*/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static assets (textures, fonts, models) change rarely but aren't hashed
    location ~* \.(png|jpe?g|gif|webp|svg|hdr|exr|glb|gltf|mp3|ogg|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # index.html must always be revalidated so new deploys show up
    location ~* /index\.html$ {
        add_header Cache-Control "no-cache";
    }
}
